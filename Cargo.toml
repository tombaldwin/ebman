[package]
name = "ebman"
version = "0.33.0"
edition = "2021"
rust-version = "1.94.1"
authors = ["Tom Baldwin <tom@polymorphism.co.uk>"]
description = "k9s-style TUI for AWS Elastic Beanstalk"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/tombaldwin/ebman"
homepage = "https://github.com/tombaldwin/ebman"
keywords = ["aws", "elasticbeanstalk", "tui", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
# `tb-tui-common` — shared TUI helpers (font_probe / overlay / theme /
# splash / util), now its own repo + crate:
# https://github.com/tombaldwin/tb-tui-common (also consumed by pgman).
# Pulled from crates.io. `package = "tb-tui-common"` keeps every
# `use tui_common::*` line working — the manifest key (`tui-common`) is
# what Rust imports as `tui_common`. To co-develop both crates from a
# side-by-side checkout, uncomment the `[patch.crates-io]` block at the
# bottom of this file (don't commit it uncommented).
tui-common = { version = "0.2", package = "tb-tui-common" }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
# io-util + io-std: the MCP server's stdio JSON-RPC transport.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util", "io-std"] }
futures = "0.3"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-elasticbeanstalk = "1"
aws-sdk-sts = "1"
aws-sdk-sqs = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-s3 = "1"
aws-sdk-ec2 = "1"
aws-sdk-acm = "1"
chrono = "0.4"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
arboard = "3"
regex = "1"
portable-pty = "0.9"
vt100 = "0.15"
aws-credential-types = { version = "1.2.13", features = ["hardcoded-credentials"] }
aws-sdk-organizations = "1.110.0"
aws-sdk-costexplorer = "1"
aws-sdk-iam = "1"
aws-sdk-wafv2 = "1"
tokio-util = { version = "0.7", features = ["codec"] }
# pid-liveness probe for the cross-process freeze marker (freeze.rs).
libc = "0.2"
aws-sdk-secretsmanager = "1"
aws-sdk-ssm = "1"
serde = { version = "1", features = ["derive"] }
# MCP server (`ebman mcp serve`): incoming JSON-RPC must be *parsed*,
# which the hand-rolled `util::json_string` emit path can't do.
serde_json = "1"
toml = "1"
# YAML parsing for the EB CLI saved-configs format (`.elasticbeanstalk/
# saved_configs/*.cfg.yml`) so `:config-diff-local` can compare a local
# saved config against the deployed env. serde_yml is the actively-
# maintained successor to the archived serde_yaml; pre-1.0 versioning
# but the read-shape we depend on (OptionSettings nested map) is stable.
serde_yml = "0.0"
# Used by `ebman explain` to talk to the LLM provider (Anthropic API
# or a local Ollama). `rustls-tls` reuses the rustls already pulled
# in by aws-sdk; default-features = false skips the openssl path.
# `json` feature deliberately OFF — request bodies are short and
# fixed, and pulling in serde_json just for them would conflict with
# the project's hand-rolled JSON output convention. We use serde_yml
# for response parsing (JSON is a YAML subset).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.11"

[lints.clippy]
# Compiler-enforced versions of two rules this codebase already follows
# by discipline. Measured before turning them on: 0 `unwrap` and 2
# `expect` in ~82k lines of non-test code, both on a static table that
# cannot fail. Discipline is what got it there; nothing stopped the next
# commit from breaking it.
#
# Deliberately NOT enabling `clippy::pedantic` wholesale — it reports
# 1712 warnings here, which is a week of `#[allow]` for nothing.
# `indexing_slicing` stays off too: 152 sites, most of them
# `Layout::split()` results that are correct by construction today.
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
# Used by one test: a source-scanning guard for the wrapped-literal
# bug needs to know where string literals begin and end, and five
# hand-rolled scanners got that wrong in five different ways (`//`
# inside a URL, `'\"'` char literals, the closing half of a
# `\\`-continued literal, raw strings). Already in the lock file
# transitively, so this costs nothing to build.
proc-macro2 = "1"
# Property tests for the four hand-rolled parsers. `parse_audit_line` is
# a char scanner with 13 `chars[i]` sites, hand-guarded by `while i < n`,
# running over a file on disk that can be truncated mid-write — the one
# place here where "never panics on arbitrary input" is worth asserting
# rather than enumerating.
proptest = "1"
# Mocked AWS clients for unit-testing aws.rs without a live AWS account.
# Used to assert on observed request shapes and exercise response variants
# (e.g. EB autocreated worker queues, paginated SQS ReceiveMessage).
aws-smithy-mocks = "0.3"
aws-smithy-types = "1"
# The `test-util` feature enables `with_test_defaults` on the SDK config
# builders, which `aws-smithy-mocks::mock_client!` relies on. Only needed
# for the test build — production paths use the regular config.
aws-sdk-elasticbeanstalk = { version = "1", features = ["test-util"] }
aws-sdk-sqs = { version = "1", features = ["test-util"] }
aws-sdk-cloudwatch = { version = "1", features = ["test-util"] }
aws-sdk-cloudwatchlogs = { version = "1", features = ["test-util"] }
aws-sdk-s3 = { version = "1", features = ["test-util"] }
aws-sdk-ec2 = { version = "1", features = ["test-util"] }
aws-sdk-acm = { version = "1", features = ["test-util"] }
aws-sdk-organizations = { version = "1.110.0", features = ["test-util"] }
aws-sdk-costexplorer = { version = "1", features = ["test-util"] }
aws-sdk-secretsmanager = { version = "1", features = ["test-util"] }
aws-sdk-ssm = { version = "1", features = ["test-util"] }
aws-sdk-iam = { version = "1", features = ["test-util"] }
# `test-util` enables `#[tokio::test(start_paused = true)]` + the
# `tokio::time::pause/advance/sleep` mocked-clock surface that
# `run_shell_command`'s polling-loop tests rely on.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
# A panic in a spawned task used to run the panic hook — which restores
# the terminal and prints a backtrace over the display — and then let
# the app CARRY ON, in a wrecked terminal, waiting on an `AppMsg` that
# would never arrive. A spinner forever, with the real error already
# scrolled past. Aborting turns that into a crash report the operator
# can act on. The hook still runs first, so the terminal is restored and
# the report is written before the abort.
panic = "abort"
lto = "thin"
codegen-units = 1
strip = true

# Local co-development of tb-tui-common: uncomment to point ebman at a
# sibling checkout instead of the crates.io copy, so edits to the shared
# crate show up here without a republish. Leave commented in git — it's a
# dev-only override and a committed path would break `cargo publish` and
# anyone building from a clean clone.
# [patch.crates-io]
# tb-tui-common = { path = "../tb-tui-common" }
